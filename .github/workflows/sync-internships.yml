name: Refresh internship feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-internships.yml"
      - "lib/internship-feed.mjs"
      - "scripts/sync-internships.mjs"
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync active opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh and prune feed
        run: npm run sync:jobs

      - name: Verify feed rules
        run: node --test tests/feed-sync.test.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- public/internships.json; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/internships.json
          git commit -m "data: refresh active internships [skip ci]"
          git push
