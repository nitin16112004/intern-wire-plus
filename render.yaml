services:
  - type: web
    name: pinecity-commutes-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: META_WA_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: WA_API_VERSION
        value: v26.0
      - key: PARMAR_CONTACT_1
        value: "+91 9817392888"
      - key: PARMAR_CONTACT_2
        value: "+91 7807288728"